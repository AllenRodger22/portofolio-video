
<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Vision Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-weight: 300;
            background-color: #ffffff;
            color: #1e293b;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 24px 0 rgba(14, 165, 233, 0.1);
        }
        .text-gradient {
            background: linear-gradient(to right, #2563eb, #0ea5e9, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Blue and White Checkerboard Pattern */
        .bg-checkerboard {
            background-color: #ffffff;
            background-image: 
                linear-gradient(45deg, #eff6ff 25%, transparent 25%), 
                linear-gradient(-45deg, #eff6ff 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #eff6ff 75%), 
                linear-gradient(-45deg, transparent 75%, #eff6ff 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }
        .video-placeholder-container::-webkit-scrollbar {
            display: none;
        }
        .video-placeholder-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script type="importmap">
